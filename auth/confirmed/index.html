<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#006d68">

  <title>Email confirmed — Learn Chinese</title>

  <link rel="icon" href="/assets/logo.png" type="image/png">
  <link rel="stylesheet" href="/assets/styles.css">
  <link rel="stylesheet" href="/assets/flashcards-auth.css">
</head>

<body data-auth-mode="confirmation">
<a class="skip-link" href="#main">Skip to content</a>

<header class="site-header">
  <nav class="nav wrap" aria-label="Main navigation">
    <a class="brand" href="/">
      <img src="/assets/logo.png" alt="" width="58" height="58">
      <span>Learn Chinese</span>
    </a>
  </nav>
</header>

<main class="auth-main" id="main">
  <article class="auth-card">
    <div class="auth-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="30">
        <path
                d="m5 12 4 4L19 6"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
        />
      </svg>
    </div>

    <h1>Email confirmed</h1>

    <p data-auth-status>
      Checking your confirmation link…
    </p>

    <div class="button-row">
      <button class="button" type="button" data-auth-open-app disabled>
        Open Learn Chinese
      </button>

      <a class="button secondary" href="/">
        Back to homepage
      </a>
    </div>
  </article>
</main>

<script src="/assets/flashcards-auth.js"></script>
</body>
</html>
