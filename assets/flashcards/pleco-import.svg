<svg xmlns="http://www.w3.org/2000/svg" width="720" height="540" viewBox="0 0 720 540" fill="none">
  <title>Importing Pleco bookmarks into My Decks</title>
  <desc>A generic three-step illustration: export bookmarked flashcards from Pleco as TXT or XML, choose Learn Chinese from the iOS share options or open a saved file, customize the deck import, and save it to My Decks.</desc>
  <rect x="20" y="18" width="680" height="504" rx="32" fill="#FFFCF6"/>
  <text x="70" y="83" fill="#0B8985" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2">FROM BOOKMARK TO STUDY DECK</text>
  <rect x="44" y="142" width="188" height="278" rx="24" fill="#FFFFFF" stroke="#DDE4E4" stroke-width="2"/>
  <text x="67" y="180" fill="#092B43" font-family="Arial,sans-serif" font-size="19" font-weight="700">Pleco bookmarks</text>
  <rect x="67" y="201" width="142" height="83" rx="14" fill="#E8F3F1"/>
  <path d="M84 224h98m-98 19h78m-78 19h59" stroke="#0B8985" stroke-width="4" stroke-linecap="round"/>
  <text x="67" y="320" fill="#537083" font-family="Arial,sans-serif" font-size="16">Export as</text>
  <rect x="67" y="337" width="61" height="39" rx="12" fill="#F6F9F9" stroke="#DDE4E4"/>
  <rect x="141" y="337" width="68" height="39" rx="12" fill="#F6F9F9" stroke="#DDE4E4"/>
  <text x="97" y="362" text-anchor="middle" fill="#315164" font-family="Arial,sans-serif" font-size="16" font-weight="700">TXT</text>
  <text x="175" y="362" text-anchor="middle" fill="#315164" font-family="Arial,sans-serif" font-size="16" font-weight="700">XML</text>
  <path d="M245 280h42" stroke="#0B8985" stroke-width="4" stroke-linecap="round"/>
  <path d="m277 268 14 12-14 12" stroke="#0B8985" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="300" y="142" width="188" height="278" rx="24" fill="#FFFFFF" stroke="#DDE4E4" stroke-width="2"/>
  <text x="323" y="180" fill="#092B43" font-family="Arial,sans-serif" font-size="19" font-weight="700">Learn Chinese</text>
  <rect x="323" y="199" width="142" height="45" rx="12" fill="#E5F3F1"/>
  <text x="394" y="227" text-anchor="middle" fill="#087F7A" font-family="Arial,sans-serif" font-size="15" font-weight="700">Choose app</text>
  <text x="394" y="264" text-anchor="middle" fill="#738995" font-family="Arial,sans-serif" font-size="12">iOS share options</text>
  <text x="323" y="301" fill="#537083" font-family="Arial,sans-serif" font-size="13" font-weight="700">CUSTOMIZE IMPORT</text>
  <rect x="323" y="315" width="142" height="31" rx="9" fill="#F6F9F9"/>
  <text x="335" y="336" fill="#315164" font-family="Arial,sans-serif" font-size="12">Name your deck</text>
  <rect x="323" y="355" width="142" height="44" rx="9" fill="#F6F9F9"/>
  <text x="335" y="373" fill="#315164" font-family="Arial,sans-serif" font-size="11">Categories:</text>
  <text x="335" y="389" fill="#738995" font-family="Arial,sans-serif" font-size="10">tags · split · ignore</text>
  <path d="M500 280h42" stroke="#0B8985" stroke-width="4" stroke-linecap="round"/>
  <path d="m532 268 14 12-14 12" stroke="#0B8985" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="555" y="142" width="120" height="278" rx="24" fill="#FFFFFF" stroke="#DBE7E8" stroke-width="2"/>
  <circle cx="615" cy="184" r="19" fill="#0B8985"/>
  <path d="m607 184 6 6 12-13" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="615" y="224" text-anchor="middle" fill="#092B43" font-family="Arial,sans-serif" font-size="15" font-weight="700">My Decks</text>
  <rect x="570" y="243" width="90" height="116" rx="14" fill="#F6F9F9"/>
  <text x="615" y="282" text-anchor="middle" fill="#092B43" font-family="Georgia,serif" font-size="29">请</text>
  <text x="615" y="308" text-anchor="middle" fill="#537083" font-family="Arial,sans-serif" font-size="12">qǐng</text>
  <path d="M586 326h58" stroke="#E0E9E9" stroke-width="2"/>
  <text x="615" y="346" text-anchor="middle" fill="#0B8985" font-family="Arial,sans-serif" font-size="10" font-weight="700">STUDY</text>
  <text x="70" y="468" fill="#738995" font-family="Arial,sans-serif" font-size="14">Saved-file import is also available when sharing is not supported.</text>
</svg>
